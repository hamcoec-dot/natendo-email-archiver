[package]
name = "natendo-archive"
version = "0.1.0"
edition = "2021"
description = "Natendo Email Archiver: local-first email archiving with best-in-class search"
license = "Apache-2.0"
repository = "https://github.com/hamcoec-dot/natendo-email-archiver"
publish = false

[lib]
name = "nea"
path = "src/lib.rs"

[[bin]]
name = "nea"
path = "src/main.rs"

[[bin]]
name = "nea-desktop"
path = "src/bin/nea-desktop.rs"
required-features = ["desktop"]

[features]
# Native window around the web UI (needs WebView2 / WKWebView / WebKitGTK).
desktop = ["dep:wry", "dep:tao", "dep:png"]

[dependencies]
wry = { version = "0.45", optional = true }
tao = { version = "0.30", optional = true }
png = { version = "0.17", optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tantivy = "0.22"
mail-parser = "0.9"
pdf-extract = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rpassword = "7"
regex = "1"
base64 = "0.22"
cfb = "0.10"
outlook-pst = "1.2"
html-escape = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2
